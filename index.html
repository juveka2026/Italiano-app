<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Italiano — Impara l'italiano</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2B2119" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B2119'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23E3A72E' font-family='Georgia'%3EI%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --ink:#2B2119; --ink-soft:#7A6C5D;
  --terracotta:#C1440E; --olive:#3E5A4E; --ochre:#E3A72E; --line:#E7DCC8; --wrong:#B8453A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#EDE6D8;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.app-shell{width:100%; display:flex; align-items:center; justify-content:center;}
.phone{
  width:390px; max-width:100%; height:780px; max-height:92vh;
  background:var(--ink); border-radius:46px; padding:12px;
  box-shadow:0 30px 60px -20px rgba(43,33,25,0.5);
  position:relative;
}
.notch{position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:24px; background:var(--ink); border-radius:14px; z-index:5;}
.screen{width:100%; height:100%; background:var(--bg); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; position:relative;}
.content{flex:1; overflow-y:auto; display:flex; flex-direction:column;}
.pad{padding:28px 20px 16px;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--terracotta); font-weight:600;}
h1.title{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--ink); margin:4px 0 0;}
.mono{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:500;}
.row-between{display:flex; justify-content:space-between; align-items:flex-start;}
.streak-badge{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px;}
.progress-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:20px;}
.track-bg{margin-top:10px; height:6px; border-radius:4px; background:var(--line); overflow:hidden;}
.track-fill{height:100%; background:linear-gradient(90deg,var(--terracotta),var(--ochre)); border-radius:4px; transition:width .4s ease;}
.lesson-hero{margin-top:12px; width:100%; display:flex; align-items:center; gap:14px; background:var(--ink); border-radius:20px; padding:16px; border:none; cursor:pointer; text-align:left;}
.city-stamp-sm{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--bg); border:1px solid var(--ochre); border-radius:999px; padding:6px 10px; text-transform:uppercase; flex-shrink:0;}
.lesson-hero-title{font-family:'Fraunces',serif; font-size:19px; color:#fff; font-weight:600;}
.lesson-hero-sub{font-size:12.5px; color:#C9BFAE; margin-top:2px;}
.arrow{color:var(--ochre); font-size:18px;}
.tip-row{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
.tip-card{display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px;}
.tip-n{font-family:'IBM Plex Mono',monospace; color:var(--olive); font-weight:600; font-size:12px;}
.tip-text{font-size:13.5px; color:var(--ink-soft); line-height:1.4;}
.lesson-list{margin-top:18px; display:flex; flex-direction:column; gap:10px;}
.lesson-row{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; width:100%; text-align:left;}
.lesson-row-num{width:34px; height:34px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); flex-shrink:0;}
.lesson-row-num.done{background:var(--olive); color:#fff; border-color:var(--olive);}
.lesson-row-title{font-family:'Fraunces',serif; font-size:16.5px; color:var(--ink); font-weight:600;}
.lesson-row-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.lesson-row-week{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--terracotta); flex-shrink:0;}
.lesson-topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 16px 6px;}
.exit-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; font-size:13px;}
.lesson-topbar-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink);}
.dots{display:flex; gap:5px; padding:10px 20px 0;}
.dot{flex:1; height:4px; border-radius:3px; background:var(--line);}
.dot.active{background:var(--terracotta);}
.flash-wrap{padding:26px 20px 10px;}
.flash-card{position:relative; background:var(--ink); border-radius:24px; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:28px 24px; text-align:center;}
.flash-card.back{background:var(--olive);}
.flash-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ochre);}
.flash-word{font-family:'Fraunces',serif; font-size:26px; color:#fff; font-weight:600; line-height:1.25;}
.flash-divider{width:36px; height:1px; background:rgba(255,255,255,0.25);}
.flash-translation{font-family:'Inter',sans-serif; font-size:16px; color:#E7DFCF; font-weight:500; line-height:1.3;}
.flash-hint{font-size:11.5px; color:#C9BFAE;}
.speak-btn{position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.12); color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s ease;}
.speak-btn:active{transform:scale(0.9);}
.speak-btn.on-light{position:static; width:32px; height:32px; border:1px solid var(--line); background:var(--surface); color:var(--terracotta); flex-shrink:0;}
.mic-btn{position:absolute; top:14px; left:14px; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.12); color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s ease, background .2s ease;}
.mic-btn:active{transform:scale(0.9);}
.mic-btn.listening{background:var(--terracotta); border-color:var(--terracotta); animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,68,14,0.5);}70%{box-shadow:0 0 0 10px rgba(193,68,14,0);}100%{box-shadow:0 0 0 0 rgba(193,68,14,0);}}
.pron-feedback{margin:0 20px 4px; border-radius:14px; padding:10px 14px; font-size:13px; line-height:1.4; display:flex; align-items:center; gap:10px;}
.pron-feedback.good{background:#E7F0EA; color:var(--olive); border:1px solid var(--olive);}
.pron-feedback.bad{background:#F6E4E1; color:var(--wrong); border:1px solid var(--wrong);}
.pron-feedback.info{background:var(--surface); color:var(--ink-soft); border:1px solid var(--line);}
.pron-score{font-family:'IBM Plex Mono',monospace; font-weight:600; flex-shrink:0;}
.dict-group-title{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 8px;}
.dict-group-title:first-child{margin-top:0;}
.word-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:8px;}
.word-speak{flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--terracotta); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.word-speak:active{transform:scale(0.9);}
.word-it{font-family:'Fraunces',serif; font-weight:600; color:var(--ink); font-size:15px; flex:1.1; line-height:1.3;}
.word-arrow{color:var(--line); font-size:13px; flex-shrink:0;}
.word-sk{font-size:13px; color:var(--ink-soft); flex:1; text-align:right; line-height:1.3;}
.primary-btn{margin:10px 20px 20px; background:var(--terracotta); color:#fff; border:none; border-radius:14px; padding:15px 0; font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; width:calc(100% - 40px);}
.quiz-q-row{display:flex; align-items:center; gap:10px; margin:6px 20px 16px;}
.quiz-q{font-family:'Fraunces',serif; font-size:22px; color:var(--ink); font-weight:600; flex:1;}
.quiz-opts{display:flex; flex-direction:column; gap:10px; padding:0 20px;}
.quiz-opt{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:14.5px; color:var(--ink); cursor:pointer; font-family:'Inter',sans-serif; width:100%;}
.quiz-opt.correct{background:#E7F0EA; border-color:var(--olive); color:var(--olive);}
.quiz-opt.wrong{background:#F6E4E1; border-color:var(--wrong); color:var(--wrong);}
.done-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px 20px;}
.stamp-big{width:110px; height:110px; border-radius:50%; border:3px solid var(--terracotta); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--terracotta); transform:rotate(-6deg); text-align:center; padding:10px;}
.stamp-grid{margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stamp-slot{aspect-ratio:1; border-radius:18px; border:2px dashed var(--olive); background:#EEF3EF; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transform:rotate(-2deg);}
.stamp-slot.empty{border:2px dashed var(--line); background:transparent; transform:none;}
.stamp-city{font-family:'Fraunces',serif; font-weight:700; color:var(--olive); font-size:14px;}
.stamp-check{color:var(--olive); font-size:15px;}
.stamp-locked{color:var(--line); font-family:'IBM Plex Mono',monospace; font-size:20px;}
.empty-state{margin-top:24px; font-size:13.5px; color:var(--ink-soft); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; line-height:1.5;}
.pill-row{display:flex; gap:10px; padding:0 20px 20px;}
.pill-btn{flex:1; padding:14px 0; border-radius:14px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;}
.pill-wrong{border:1px solid var(--wrong); background:#F6E4E1; color:var(--wrong);}
.pill-right{border:1px solid var(--olive); background:#E7F0EA; color:var(--olive);}
.bottom-nav{display:flex; border-top:1px solid var(--line); background:var(--surface); padding:8px 4px 14px;}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:6px 0; font-family:'Inter',sans-serif;}
.nav-btn.active{color:var(--terracotta);}
.nav-icon{font-size:17px;}
.nav-label{font-size:10px; font-family:'IBM Plex Mono',monospace;}
.install-hint{max-width:390px; margin-top:14px; text-align:center; font-size:12px; color:var(--ink-soft); font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen"></div>
  </div>
</div>

    quiz:[{q:"C'era una volta...",opts:["Jedného dňa...","Kedysi dávno...","Nakoniec...","Zrazu..."],a:1},{q:"Ako sa povie 'zrazu'?",opts:["Alla fine","Un giorno","Improvvisamente","Accadde"],a:2},{q:"La fiaba",opts:["Príbeh","Rozprávka","Legenda","Bájka"],a:1},{q:"Il protagonista",opts:["Autor","Hlavná postava","Vedľajšia postava","Rozprávač"],a:1}]},
  { id:"l39", city:"Sorrento", week:21, title:"Proverbi e modi di dire", subtitle:"Príslovia a porekadlá",
    vocab:[["Chi dorme non piglia pesci","Kto skoro vstáva, tomu Boh dáva"],["Meglio tardi che mai","Lepšie neskoro ako nikdy"],["Tutto è bene quel che finisce bene","Všetko dobre dopadne"],["Non è tutto oro quel che luccica","Nie je všetko zlato, čo sa blyští"],["L'unione fa la forza","V jednote je sila"],["Chi trova un amico trova un tesoro","Kto nájde priateľa, nájde poklad"],["Chi cerca trova","Kto hľadá, nájde"],["Ride bene chi ride ultimo","Kto sa smeje naposledy, ten sa smeje najlepšie"]],
    quiz:[{q:"Meglio tardi che mai",opts:["Lepšie nikdy ako neskoro","Lepšie neskoro ako nikdy","Vždy načas","Nikdy nie je neskoro"],a:1},{q:"Ako sa povie 'V jednote je sila'?",opts:["Chi cerca trova","L'unione fa la forza","Chi dorme non piglia pesci","Ride bene chi ride ultimo"],a:1},{q:"Non è tutto oro quel che luccica",opts:["Všetko čo sa blyští je zlato","Nie je všetko zlato, čo sa blyští","Zlato sa vždy blyští","Striebro je cennejšie"],a:1},{q:"Chi trova un amico trova un tesoro",opts:["Kto hľadá poklad, nájde priateľa","Kto nájde priateľa, nájde poklad","Priatelia sú ako poklady","Poklad je vzácnejší ako priateľ"],a:1}]},
  { id:"l40", city:"Bolzano", week:21, title:"Conversazione fluente", subtitle:"Záverečné opakovanie",
    vocab:[["Ad ogni modo...","Každopádne..."],["Per quanto riguarda...","Čo sa týka..."],["D'altra parte...","Na druhej strane..."],["Innanzitutto...","Predovšetkým..."],["Infine...","Nakoniec..."],["A proposito...","Mimochodom..."],["Cioè...","Teda / to znamená..."],["Insomma...","Skrátka a dobre..."]],
    quiz:[{q:"D'altra parte",opts:["Predovšetkým","Na druhej strane","Nakoniec","Mimochodom"],a:1},{q:"Ako sa povie 'mimochodom'?",opts:["Cioè","Insomma","A proposito","Infine"],a:2},{q:"Per quanto riguarda",opts:["Čo sa týka","Napriek tomu","Preto","Okrem toho"],a:0},{q:"Innanzitutto",opts:["Nakoniec","Predovšetkým","Mimochodom","Skrátka"],a:1}]},
];
const TOTAL = LESSONS.length;
const STORAGE_KEY = "italiano-progress-v1";

/* ============ VÝSLOVNOSŤ ============ */
let cachedItalianVoice = null;
function primeVoices(){
  if(!window.speechSynthesis) return;
  const pick = () => {
    const voices = window.speechSynthesis.getVoices();
    cachedItalianVoice = voices.find(v=>v.lang && v.lang.toLowerCase()==="it-it") ||
                          voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("it")) || null;
  };
  pick();
  window.speechSynthesis.onvoiceschanged = pick;
}
function speakItalian(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="it-IT"; u.rate=0.85; u.pitch=1;
    if(cachedItalianVoice) u.voice = cachedItalianVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ KONTROLA VÝSLOVNOSTI (Speech Recognition) ============ */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let recognizer = null;
let isListening = false;

function normalizeForCompare(s){
  return s.toLowerCase()
    .replace(/[.,!?…'’()]/g,"")
    .replace(/à/g,"a").replace(/è|é/g,"e").replace(/ì/g,"i").replace(/ò/g,"o").replace(/ù/g,"u")
    .replace(/\s+/g," ")
    .trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function similarityScore(target, heard){
  const t = normalizeForCompare(target);
  const h = normalizeForCompare(heard);
  if(!t.length) return 0;
  const dist = levenshtein(t,h);
  const score = Math.max(0, 1 - dist / Math.max(t.length, h.length, 1));
  return Math.round(score*100);
}

function startPronunciationCheck(targetText){
  if(!SpeechRecognitionCtor){
    state.pronFeedback = { kind:"info", text:"Rozpoznávanie reči nie je v tomto prehliadači podporované. Skús to v Chrome, alebo priamo v Safari (nie v móde 'Pridané na plochu')." };
    render();
    return;
  }
  if(isListening) return;
  try{
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = "it-IT";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    isListening = true;
    state.pronFeedback = null;
    render();

    recognizer.onresult = (event) => {
      const heard = event.results[0][0].transcript;
      const score = similarityScore(targetText, heard);
      if(score >= 75){
        state.pronFeedback = { kind:"good", text:`Počul som: „${heard}"`, score };
      } else {
        state.pronFeedback = { kind:"bad", text:`Počul som: „${heard}" — skús to znova`, score };
      }
      isListening = false;
      render();
    };
    recognizer.onerror = (event) => {
      isListening = false;
      let msg = "Nepodarilo sa rozpoznať reč. Skús to znova.";
      if(event.error === "not-allowed" || event.error === "service-not-allowed"){
        msg = "Appka nemá povolenie na mikrofón. Povoľ ho v nastaveniach prehliadača a skús znova.";
      } else if(event.error === "no-speech"){
        msg = "Nič som nepočul. Skús hovoriť hlasnejšie a bližšie k telefónu.";
      }
      state.pronFeedback = { kind:"bad", text:msg };
      render();
    };
    recognizer.onend = () => {
      isListening = false;
      render();
    };
    recognizer.start();
  }catch(e){
    isListening = false;
    state.pronFeedback = { kind:"info", text:"Rozpoznávanie reči sa nepodarilo spustiť na tomto zariadení." };
    render();
  }
}

/* ============ STAV ============ */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { completed:{}, streak:1, known:{} };
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
let state = {
  tab:"home",
  progress: loadProgress(),
  activeLesson: null,
  lessonPhase:"cards", cardIdx:0, flipped:false,
  quizIdx:0, quizSelected:null, quizCorrect:0,
  praticaOrder:null, praticaPos:0, praticaFlipped:false,
  pronFeedback:null,
};

function esc(s){ const d=document.createElement("div"); d.innerText=s; return d.innerHTML; }

/* ============ RENDER ============ */
function render(){
  const screen = document.getElementById("screen");
  if(state.activeLesson){
    screen.innerHTML = renderLesson();
  } else {
    screen.innerHTML = `<div class="content" id="content">${renderTab()}</div>${renderNav()}`;
  }
  attachHandlers();
}

function renderNav(){
  const items=[["home","⌂","Home"],["lezioni","▤","Lezioni"],["pratica","◐","Pratica"],["slovnik","≡","Slovník"],["passaporto","▣","Passaporto"]];
  return `<div class="bottom-nav">${items.map(([id,icon,label])=>`
    <button class="nav-btn ${state.tab===id?'active':''}" data-nav="${id}">
      <div class="nav-icon">${icon}</div><div class="nav-label">${label}</div>
    </button>`).join("")}</div>`;
}

function renderTab(){
  if(state.tab==="home") return renderHome();
  if(state.tab==="lezioni") return renderLezioni();
  if(state.tab==="pratica") return renderPratica();
  if(state.tab==="slovnik") return renderSlovnik();
  if(state.tab==="passaporto") return renderPassaporto();
  return "";
}

function renderHome(){
  const completedCount = Object.keys(state.progress.completed).length;
  const pct = Math.round((completedCount/TOTAL)*100);
  const next = LESSONS.find(l=>!state.progress.completed[l.id]) || LESSONS[LESSONS.length-1];
  return `
  <div class="pad">
    <div class="row-between">
      <div><div class="eyebrow">Il tuo viaggio</div><h1 class="title">Buongiorno</h1></div>
      <div class="streak-badge">🔥<span class="mono" style="font-size:15px">${state.progress.streak}</span></div>
    </div>
    <div class="progress-card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="mono">${completedCount}/${TOTAL} lezioni</span>
        <span class="mono" style="color:var(--terracotta)">${pct}%</span>
      </div>
      <div class="track-bg"><div class="track-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="eyebrow" style="margin-top:18px">Prossima tappa</div>
    <button class="lesson-hero" data-open-lesson="${next.id}">
      <div class="city-stamp-sm">${next.city}</div>
      <div style="flex:1;text-align:left">
        <div class="lesson-hero-title">${next.title}</div>
        <div class="lesson-hero-sub">${next.subtitle}</div>
      </div>
      <div class="arrow">→</div>
    </button>
    <div class="eyebrow" style="margin-top:22px">Perché funziona</div>
    <div class="tip-row">
      <div class="tip-card"><div class="tip-n">01</div><div class="tip-text">15 minúť denne stačí — krátke lekcie, opakovanie kartičiek.</div></div>
      <div class="tip-card"><div class="tip-n">02</div><div class="tip-text">Každá dokončená lekcia = pečiatka do pasu. Zbieraj mestá.</div></div>
    </div>
  </div>`;
}

function renderLezioni(){
  return `
  <div class="pad">
    <div class="eyebrow">Percorso completo</div>
    <h1 class="title">Lezioni</h1>
    <div class="lesson-list">
      ${LESSONS.map((l,i)=>{
        const done = !!state.progress.completed[l.id];
        return `<button class="lesson-row" data-open-lesson="${l.id}">
          <div class="lesson-row-num ${done?'done':''}">${done?'✓':i+1}</div>
          <div style="flex:1;text-align:left">
            <div class="lesson-row-title">${l.title}</div>
            <div class="lesson-row-sub">${l.subtitle} · ${l.city}</div>
          </div>
          <div class="lesson-row-week">SETT. ${l.week}</div>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}

function renderPratica(){
  const allWords = LESSONS.filter(l=>state.progress.completed[l.id]).flatMap(l=>l.vocab);
  if(!allWords.length){
    return `<div class="pad">
      <div class="eyebrow">Ripasso</div><h1 class="title">Pratica</h1>
      <div class="empty-state">Dokonči aspoň jednu lekciu, aby si tu mal slovíčka na precvičovanie.</div>
    </div>`;
  }
  if(!state.praticaOrder){
    state.praticaOrder = [...allWords].sort(()=>Math.random()-0.5);
    state.praticaPos = 0;
  }
  const word = state.praticaOrder[state.praticaPos % state.praticaOrder.length];
  return `
  <div class="pad" style="display:flex;flex-direction:column;height:100%">
    <div class="eyebrow">Ripasso · ${allWords.length} slov</div>
    <h1 class="title">Pratica</h1>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div class="flash-wrap">
        <div class="flash-card">
          <button class="speak-btn" data-speak="${esc(word[0])}">🔊</button>
          <button class="mic-btn ${isListening?'listening':''}" data-mic="${esc(word[0])}">🎤</button>
          <div class="flash-label">ITALIANO</div>
          <div class="flash-word">${esc(word[0])}</div>
          <div class="flash-divider"></div>
          <div class="flash-translation">${esc(word[1])}</div>
          <div class="flash-hint">🔊 výslovnosť · 🎤 skús povedať nahlas</div>
        </div>
      </div>
      ${state.pronFeedback ? `<div class="pron-feedback ${state.pronFeedback.kind}">
        ${typeof state.pronFeedback.score==="number" ? `<div class="pron-score">${state.pronFeedback.score}%</div>` : ""}
        <div>${esc(state.pronFeedback.text)}</div>
      </div>` : ""}
    </div>
  </div>
  <div class="pill-row">
    <button class="pill-btn pill-wrong" data-pratica-mark="0">Neviem</button>
    <button class="pill-btn pill-right" data-pratica-mark="1">Viem</button>
  </div>`;
}

function renderSlovnik(){
  const doneLessons = LESSONS.filter(l=>state.progress.completed[l.id]);
  const totalWords = doneLessons.reduce((n,l)=>n+l.vocab.length,0);
  if(!doneLessons.length){
    return `<div class="pad">
      <div class="eyebrow">Repertorio</div><h1 class="title">Slovník</h1>
      <div class="empty-state">Dokonči aspoň jednu lekciu a všetky jej slovíčka sa tu objavia na opakovanie.</div>
    </div>`;
  }
  return `
  <div class="pad">
    <div class="eyebrow">${totalWords} slov · ${doneLessons.length} lezioni</div>
    <h1 class="title">Slovník</h1>
    <div style="margin-top:14px">
      ${doneLessons.map(l=>`
        <div class="dict-group-title">${esc(l.title)} · ${esc(l.city)}</div>
        ${l.vocab.map(v=>`
          <div class="word-row">
            <button class="word-speak" data-speak="${esc(v[0])}">🔊</button>
            <div class="word-it">${esc(v[0])}</div>
            <div class="word-arrow">→</div>
            <div class="word-sk">${esc(v[1])}</div>
          </div>
        `).join("")}
      `).join("")}
    </div>
  </div>`;
}

function renderPassaporto(){
  const completedCount = Object.keys(state.progress.completed).length;
  return `
  <div class="pad">
    <div class="eyebrow">${completedCount}/${TOTAL} pečiatok</div>
    <h1 class="title">Passaporto</h1>
    <div class="stamp-grid">
      ${LESSONS.map(l=>{
        const done = !!state.progress.completed[l.id];
        return `<div class="stamp-slot ${done?'':'empty'}">
          ${done ? `<div class="stamp-city">${l.city}</div><div class="stamp-check">✓</div>` : `<div class="stamp-locked">?</div>`}
        </div>`;
      }).join("")}
    </div>
    ${completedCount===TOTAL ? `<div class="empty-state">🎉 Hai completato tutto il percorso base. Complimenti!</div>` : ""}
  </div>`;
}

function renderLesson(){
  const lesson = state.activeLesson;
  let inner = "";
  if(state.lessonPhase==="cards"){
    const v = lesson.vocab[state.cardIdx];
    inner = `
    <div class="content" style="justify-content:space-between">
      <div>
        <div class="dots">${lesson.vocab.map((_,i)=>`<div class="dot ${i<=state.cardIdx?'active':''}"></div>`).join("")}</div>
        <div class="flash-wrap">
          <div class="flash-card">
            <button class="speak-btn" data-speak="${esc(v[0])}">🔊</button>
            <button class="mic-btn ${isListening?'listening':''}" data-mic="${esc(v[0])}">🎤</button>
            <div class="flash-label">ITALIANO</div>
            <div class="flash-word">${esc(v[0])}</div>
            <div class="flash-divider"></div>
            <div class="flash-translation">${esc(v[1])}</div>
            <div class="flash-hint">🔊 výslovnosť · 🎤 skús povedať nahlas</div>
          </div>
        </div>
        ${state.pronFeedback ? `<div class="pron-feedback ${state.pronFeedback.kind}">
          ${typeof state.pronFeedback.score==="number" ? `<div class="pron-score">${state.pronFeedback.score}%</div>` : ""}
          <div>${esc(state.pronFeedback.text)}</div>
        </div>` : ""}
      </div>
      <button class="primary-btn" data-next-card="1">${state.cardIdx<lesson.vocab.length-1?'Ďalšie slovo':'Prejsť na kvíz'}</button>
    </div>`;
  } else if(state.lessonPhase==="quiz"){
    const q = lesson.quiz[state.quizIdx];
    inner = `
    <div class="content">
      <div class="dots">${lesson.quiz.map((_,i)=>`<div class="dot ${i<=state.quizIdx?'active':''}"></div>`).join("")}</div>
      <div class="eyebrow" style="margin:14px 20px 0">Ako sa povie po slovensky:</div>
      <div class="quiz-q-row">
        <div class="quiz-q">${esc(q.q)}</div>
        <button class="speak-btn on-light" data-speak="${esc(q.q)}">🔊</button>
      </div>
      <div class="quiz-opts">
        ${q.opts.map((opt,i)=>{
          let cls="quiz-opt";
          if(state.quizSelected!==null){
            if(i===q.a) cls+=" correct";
            else if(i===state.quizSelected) cls+=" wrong";
          }
          return `<button class="${cls}" data-quiz-opt="${i}">${esc(opt)}</button>`;
        }).join("")}
      </div>
    </div>`;
  } else {
    inner = `
    <div class="done-wrap">
      <div class="stamp-big">${lesson.city}</div>
      <h1 class="title" style="margin-top:18px">Lezione completata!</h1>
      <div class="mono">${state.quizCorrect}/${lesson.quiz.length} správne</div>
      <button class="primary-btn" style="margin-top:26px;width:100%" data-finish-lesson="1">Získať pečiatku</button>
    </div>`;
  }
  return `
  <div style="display:flex;flex-direction:column;height:100%">
    <div class="lesson-topbar">
      <button class="exit-btn" data-exit-lesson="1">✕</button>
      <div class="lesson-topbar-title">${lesson.title}</div>
      <div style="width:30px"></div>
    </div>
    ${inner}
  </div>`;
}

/* ============ EVENTY ============ */
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = ()=>{ state.tab = el.getAttribute("data-nav"); state.pronFeedback=null; render(); };
  });
  document.querySelectorAll("[data-open-lesson]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute("data-open-lesson");
      state.activeLesson = LESSONS.find(l=>l.id===id);
      state.lessonPhase="cards"; state.cardIdx=0; state.flipped=false; state.pronFeedback=null;
      state.quizIdx=0; state.quizSelected=null; state.quizCorrect=0;
      render();
    };
  });
  const exitBtn = document.querySelector("[data-exit-lesson]");
  if(exitBtn) exitBtn.onclick = ()=>{ state.activeLesson=null; render(); };

  const nextCard = document.querySelector("[data-next-card]");
  if(nextCard) nextCard.onclick = ()=>{
    const lesson = state.activeLesson;
    state.pronFeedback = null;
    if(state.cardIdx < lesson.vocab.length-1){ state.cardIdx++; state.flipped=false; }
    else { state.lessonPhase="quiz"; }
    render();
  };

  document.querySelectorAll("[data-quiz-opt]").forEach(el=>{
    el.onclick = ()=>{
      if(state.quizSelected!==null) return;
      const i = parseInt(el.getAttribute("data-quiz-opt"),10);
      const lesson = state.activeLesson;
      const q = lesson.quiz[state.quizIdx];
      state.quizSelected = i;
      if(i===q.a) state.quizCorrect++;
      render();
      setTimeout(()=>{
        if(state.quizIdx < lesson.quiz.length-1){ state.quizIdx++; state.quizSelected=null; }
        else { state.lessonPhase="done"; }
        render();
      }, 700);
    };
  });

  const finishBtn = document.querySelector("[data-finish-lesson]");
  if(finishBtn) finishBtn.onclick = ()=>{
    const lesson = state.activeLesson;
    state.progress.completed[lesson.id] = { correctCount:state.quizCorrect, totalQ:lesson.quiz.length, at:Date.now() };
    saveProgress(state.progress);
    state.activeLesson = null;
    state.tab = "passaporto";
    render();
  };

  document.querySelectorAll("[data-pratica-mark]").forEach(el=>{
    el.onclick = ()=>{
      const known = el.getAttribute("data-pratica-mark")==="1";
      const word = state.praticaOrder[state.praticaPos % state.praticaOrder.length];
      state.progress.known[word[0]] = known;
      saveProgress(state.progress);
      state.praticaFlipped=false;
      state.pronFeedback=null;
      state.praticaPos++;
      render();
    };
  });

  document.querySelectorAll("[data-mic]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      startPronunciationCheck(el.getAttribute("data-mic"));
    };
  });

  document.querySelectorAll("[data-speak]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      speakItalian(el.getAttribute("data-speak"));
      el.style.transform="scale(0.9)";
      setTimeout(()=>{ el.style.transform="scale(1)"; }, 250);
    };
  });
}

primeVoices();
render();
</script>
